# Plans de system-upgrade-controller (v0.20.x) para Ubuntu 22.04 -> 24.04 + kernel.
# Un nodo solo entra al Plan cuando se le pone el label os-upgrade=noble.
# Al terminar con éxito, SUC cambia el label a os-upgrade=done.
#
# Requiere el Secret previo:
#   kubectl -n system-upgrade create secret generic ubuntu-noble --from-file=upgrade.sh
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: ubuntu-noble-workers
  namespace: cattle-system
spec:
  version: "24.04"                 # tag de la imagen: ubuntu:24.04
  concurrency: 1
  exclusive: true                  # nunca en paralelo con el Plan de control plane
  jobActiveDeadlineSecs: 7200      # 2 h por nodo, reboots incluidos
  serviceAccountName: system-upgrade-controller
  nodeSelector:
    matchExpressions:
      - {key: os-upgrade, operator: In, values: ["noble"]}
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  secrets:
    - name: ubuntu-noble
      path: /host/run/system-upgrade/secrets/ubuntu-noble
      ignoreUpdates: true          # editar el script no re-dispara nodos ya terminados
  drain:
    force: false
    ignoreDaemonSets: true
    deleteEmptydirData: true
  upgrade:
    image: ubuntu
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/ubuntu-noble/upgrade.sh"]
    envs:
      - name: KERNEL_FLAVOR
        value: hwe                 # hwe = kernel HWE de 24.04 | ga = 6.8 GA
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: ubuntu-noble-cp
  namespace: cattle-system
spec:
  version: "24.04"
  concurrency: 1
  exclusive: true
  jobActiveDeadlineSecs: 7200
  postCompleteDelay: 10m           # margen para que etcd se estabilice antes del siguiente
  serviceAccountName: system-upgrade-controller
  nodeSelector:
    matchExpressions:
      - {key: os-upgrade, operator: In, values: ["noble"]}
      - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
  tolerations:
    - operator: Exists
  secrets:
    - name: ubuntu-noble
      path: /host/run/system-upgrade/secrets/ubuntu-noble
      ignoreUpdates: true
  drain:
    force: false
    ignoreDaemonSets: true
    deleteEmptydirData: true
  upgrade:
    image: ubuntu
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/ubuntu-noble/upgrade.sh"]
    envs:
      - name: KERNEL_FLAVOR
        value: hwe
