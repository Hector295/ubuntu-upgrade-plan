# VM lab for 24.04 -> 26.04 (LAB_UBUNTU=24.04). Same official SUC v0.16.3: namespace
# system-upgrade and ServiceAccount system-upgrade instead of the Rancher ones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/target-version

namespace: system-upgrade

configMapGenerator:
  - name: os-upgrade-config
    behavior: merge
    envs:
      - config.env

patches:
  - target: {kind: Plan}
    patch: |
      - op: replace
        path: /spec/serviceAccountName
        value: system-upgrade
  # The lab does not need to wait 10 min between control planes.
  - target: {kind: Plan, name: os-upgrade-cp}
    patch: |
      - op: replace
        path: /spec/postCompleteDelay
        value: 2m
