# Cluster lab. Para un cluster nuevo: copiar este directorio y editar config.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/target-version

configMapGenerator:
  - name: os-upgrade-config
    behavior: merge
    envs:
      - config.env

