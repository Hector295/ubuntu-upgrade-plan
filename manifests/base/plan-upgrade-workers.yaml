# Worker upgrade (nodes without the control-plane role). Nodes: label os-upgrade=upgrade.
# Job order: prepare (preflight, BEFORE the drain) -> drain -> upgrade (1 reboot).
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-upgrade-workers
spec:
  version: "24.04"                 # replaced by TARGET_VERSION (components/target-version)
  concurrency: 1
  exclusive: true                  # see the note in plan-predownload.yaml
  jobActiveDeadlineSecs: 7200      # per node, drain and reboot included
  serviceAccountName: system-upgrade-controller
  nodeSelector:
    matchExpressions:
      - {key: os-upgrade, operator: In, values: ["upgrade"]}
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  tolerations:
    - operator: Exists
  secrets:
    - name: os-upgrade-script
      path: /host/run/system-upgrade/secrets/os-upgrade
  prepare:
    image: docker.io/library/ubuntu:24.04
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/os-upgrade/upgrade.sh", "prepare"]
    envFrom:
      - configMapRef:
          name: os-upgrade-config
      # Optional proxy with credentials (proxy.env in the overlay, docs/configuration.md#proxy).
      # It goes after the ConfigMap: its values win.
      - secretRef:
          name: os-upgrade-proxy
          optional: true
    securityContext:
      privileged: true             # SUC only makes the upgrade container privileged by default
  # No drain.timeout: in SUC v0.16 it is int32 nanoseconds (max ~2 s) and breaks the
  # controller. rollout.sh supervises the drain with its own --drain-timeout.
  drain:
    force: false
    ignoreDaemonSets: true
    deleteEmptydirData: true
  upgrade:
    image: docker.io/library/ubuntu:24.04
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/os-upgrade/upgrade.sh", "upgrade"]
    envFrom:
      - configMapRef:
          name: os-upgrade-config
      # Optional proxy with credentials (proxy.env in the overlay, docs/configuration.md#proxy).
      # It goes after the ConfigMap: its values win.
      - secretRef:
          name: os-upgrade-proxy
          optional: true
