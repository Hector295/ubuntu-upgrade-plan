# Predownload of the target version packages and the kernel. No drain, cordon or reboot:
# it can run days before the window. Nodes: label os-upgrade=predownload.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-upgrade-predownload
spec:
  version: "24.04"                 # replaced by TARGET_VERSION (components/target-version)
  concurrency: 2                   # nodes downloading at once (mind the proxy)
  # exclusive in SUC v0.16 = per-node anti-affinity: this Job cannot run on the same node as
  # another exclusive Plan (e.g. the upgrade one). It does not serialize the cluster.
  exclusive: true
  jobActiveDeadlineSecs: 3600
  serviceAccountName: system-upgrade-controller
  nodeSelector:
    matchExpressions:
      - {key: os-upgrade, operator: In, values: ["predownload"]}
  tolerations:
    - operator: Exists
  secrets:
    - name: os-upgrade-script
      path: /host/run/system-upgrade/secrets/os-upgrade
  upgrade:
    image: docker.io/library/ubuntu:24.04
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/os-upgrade/upgrade.sh", "predownload"]
    envFrom:
      - configMapRef:
          name: os-upgrade-config
      # Optional proxy with credentials (proxy.env in the overlay, docs/configuration.md#proxy).
      # It goes after the ConfigMap: its values win.
      - secretRef:
          name: os-upgrade-proxy
          optional: true
