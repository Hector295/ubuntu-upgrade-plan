# Base shared by every cluster. Do not edit it for a specific cluster: create an overlay
# in manifests/overlays/<cluster> (see docs/configuration.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cattle-system

resources:
  - plan-predownload.yaml
  - plan-upgrade-workers.yaml
  - plan-upgrade-cp.yaml

configurations:
  - kustomizeconfig.yaml

# The script and the configuration carry a hash in their names: any change creates a new
# Secret/ConfigMap and, with it, a new Plan. This way every node runs a known version.
secretGenerator:
  - name: os-upgrade-script
    files:
      - upgrade.sh=../../scripts/upgrade.sh

configMapGenerator:
  - name: os-upgrade-config
    envs:
      - config.env
