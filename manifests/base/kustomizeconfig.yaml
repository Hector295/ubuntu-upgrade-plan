# Tells kustomize where a Plan (CRD) references Secrets, ConfigMaps and images, so that it
# propagates the hashed names and the "images" field of the overlays.
nameReference:
  - kind: Secret
    fieldSpecs:
      - kind: Plan
        path: spec/secrets/name
  - kind: ConfigMap
    fieldSpecs:
      - kind: Plan
        path: spec/prepare/envFrom/configMapRef/name
      - kind: Plan
        path: spec/upgrade/envFrom/configMapRef/name
images:
  - kind: Plan
    path: spec/prepare/image
  - kind: Plan
    path: spec/upgrade/image
