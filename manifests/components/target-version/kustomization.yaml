# Plans spec.version = TARGET_VERSION from the overlay ConfigMap. It is a component so that it
# runs after the overlay has merged its config.env.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

replacements:
  - source:
      kind: ConfigMap
      name: os-upgrade-config
      fieldPath: data.TARGET_VERSION
    targets:
      - select:
          kind: Plan
        fieldPaths:
          - spec.version
